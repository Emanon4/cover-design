name: Validate skill contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_cover_plan.py --self-test
      - run: python scripts/validate_cover_plan.py tests/fixtures/battery-plan.md
      - run: python scripts/validate_cover_plan.py tests/fixtures/ai-tutorial-plan.md
      - run: python scripts/validate_cover_plan.py tests/fixtures/ai-ab-plan.md
